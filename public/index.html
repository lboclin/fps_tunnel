<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS Tunnel Game</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="instructions" style="display: none;">
        <p style="font-size:36px">Click to Play</p>
        <p>W, A, S, D to Move</p>
        <p>MOUSE to Look</p>
        <p>CLICK to Shoot</p>
        <p>R to Reload</p>
    </div>
    <div id="start-screen">
        <h1>FPS Tunnel Game</h1>
        <input type="text" id="nickname-input" placeholder="Enter Nickname" maxlength="15">
        <p>Choose Color:</p>
        <div id="color-selection">
            <!-- Colors generated by JS or static -->
            <div class="color-btn" data-color="#ff0000" style="background-color: #ff0000;"></div>
            <div class="color-btn" data-color="#00ff00" style="background-color: #00ff00;"></div>
            <div class="color-btn" data-color="#0000ff" style="background-color: #0000ff;"></div>
            <div class="color-btn" data-color="#ffff00" style="background-color: #ffff00;"></div>
            <div class="color-btn" data-color="#ff00ff" style="background-color: #ff00ff;"></div>
            <div class="color-btn" data-color="#00ffff" style="background-color: #00ffff;"></div>
            <div class="color-btn" data-color="#ffffff" style="background-color: #ffffff;"></div>
            <div class="color-btn" data-color="#000000" style="background-color: #000000;"></div>
            <div class="color-btn" data-color="#ffa500" style="background-color: #ffa500;"></div>
        </div>
        <button id="start-btn">PLAY</button>
    </div>

    <div id="match-timer">04:00</div>

    <div id="crosshair">+</div>
    <div id="hit-marker"></div>
    
    <div id="ammo-display">7 / 7</div>
    <div id="reload-indicator">RELOADING...</div>
    <div id="kill-feed"></div>

    <div id="leaderboard">
        <h3>Leaderboard</h3>
        <ul id="leaderboard-list">
            <!-- Items added by JS -->
        </ul>
    </div>

    <div id="chat-container">
        <div id="chat-messages"></div>
        <input type="text" id="chat-input" placeholder="Type message..." maxlength="50">
    </div>

    <div id="health-bar-container">
        <div id="health-bar-fill"></div>
        <span id="health-value">100%</span>
    </div>

    <div id="death-screen" style="display: none;">
        <h1>YOU DIED</h1>
        <button id="respawn-btn">PLAY AGAIN</button>
    </div>

    <div id="weapon-menu" style="display: none;">
        <h2>Select Weapon</h2>
        <div class="weapon-grid">
            <div class="weapon-card" onclick="selectWeaponFromMenu('ak47')">AK-47</div>
            <div class="weapon-card" onclick="selectWeaponFromMenu('smg')">SMG</div>
            <div class="weapon-card" onclick="selectWeaponFromMenu('revolver')">Revolver</div>
            <div class="weapon-card" onclick="selectWeaponFromMenu('sniper')">Sniper</div>
            <div class="weapon-card" onclick="selectWeaponFromMenu('laser')">Laser Gun</div>
        </div>
        <p>Press B to Close</p>
    </div>

    <div id="voting-overlay" style="display: none;">
        <h2>Vote for Next Map</h2>
        <div id="vote-options">
            <!-- Buttons injected here -->
        </div>
        <p id="vote-status">Waiting for votes...</p>
    </div>

    <div id="settings-modal" style="display: none;">
        <h2>Settings</h2>
        <div class="setting-row">
            <label>Mouse Sensitivity: <span id="sens-val">1.0</span></label>
            <input type="range" id="sens-input" min="0.1" max="5.0" step="0.1" value="1.0">
        </div>
        <div class="setting-row">
            <label>Sniper Sensitivity: <span id="sniper-sens-val">0.5</span></label>
            <input type="range" id="sniper-sens-input" min="0.1" max="2.0" step="0.1" value="0.5">
        </div>
        <div class="setting-row">
            <label>FOV: <span id="fov-val">80</span></label>
            <input type="range" id="fov-input" min="60" max="110" step="1" value="80">
        </div>
        <button id="close-settings-btn">Close (ESC)</button>
    </div>

    <!-- Scope Overlay -->
    <div id="scope-overlay" style="display: none;">
        <div class="scope-crosshair vertical"></div>
        <div class="scope-crosshair horizontal"></div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="game.js"></script>
</body>
</html>
